<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Checkpoint 0</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        color: #f4efe6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(11, 16, 32, 0.72);
        border: 1px solid rgba(255, 206, 115, 0.35);
        backdrop-filter: blur(6px);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #hud h1 {
        font-size: 15px;
        color: #ffd479;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>Đảo Đèn Lồng — CP0 Hello 3D</h1>
      <div id="hud-state">Initializing...</div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
