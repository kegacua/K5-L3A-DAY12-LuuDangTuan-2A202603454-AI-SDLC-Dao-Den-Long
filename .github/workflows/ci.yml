name: CI Verification

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification (typecheck, build, test, determinism)
        run: npm run verify
